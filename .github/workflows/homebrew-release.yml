name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.3)'
        required: true
        default: 'v0.0.3'

jobs:
  update-tap:
    runs-on: macos-latest
    steps:
      - name: Checkout photools
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Generate Formula & Cask
        run: |
          chmod +x ./script/release_homebrew.sh
          ./script/release_homebrew.sh "${{ steps.vars.outputs.tag }}"

      - name: Push to homebrew-tap
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          source-directory: 'Formula'
          destination-github-username: 'vincentchyu'
          destination-repository-name: 'homebrew-tap'
          user-email: 'vincentchyu@gmail.com'
          target-directory: 'Formula'
          target-branch: 'main'
          commit-message: 'feat(release): bump photools to ${{ steps.vars.outputs.tag }}'

      - name: Push Casks to homebrew-tap
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.TAP_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          source-directory: 'Casks'
          destination-github-username: 'vincentchyu'
          destination-repository-name: 'homebrew-tap'
          user-email: 'vincentchyu@gmail.com'
          target-directory: 'Casks'
          target-branch: 'main'
          commit-message: 'feat(release): bump photools cask to ${{ steps.vars.outputs.tag }}'
